<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>RAKEZ Vision, Mission &amp; Values</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&display=swap">
<style>
/* Layout: navy RAKEZ hero with logo plate; one overlapping form card holding a
   clickable stepper, one panel per step and a Back/Next bar. Option cards sit in
   auto-fit grids so they reflow from 3 columns (desktop) to 1 (phone). */
:root{
  --navy:#17203A; --navy-2:#1B2A44; --teal-deep:#005755; --teal:#01C1BC; --teal-2:#00A7A2; --gold:#DAA600; --gold-ink:#7A5E00;
  --ink:#1B2333; --muted:#5B6577; --soft:#8A94A6; --line:#E3E8EE; --line-2:#EEF2F5;
  --bg:#F3F6F9; --card:#FFFFFF; --tint:#E9F6F5; --tint-2:#F4FBFA; --gold-tint:#FFF6DC; --err:#B3261E; --err-bg:#FDECEA;
  --display:'Fraunces',Georgia,'Times New Roman',serif;
  --body:'Plus Jakarta Sans',Calibri,'Segoe UI',system-ui,-apple-system,Arial,sans-serif;
  --radius:18px; --r-sm:12px;
  --shadow:0 1px 2px rgba(23,32,58,.06),0 16px 40px rgba(23,32,58,.08);
  --shadow-sel:0 0 0 2px var(--teal-deep),0 10px 26px rgba(0,87,85,.14);
  --gutter:clamp(16px,4vw,40px);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
img{max-width:100%}
.container{width:100%;max-width:1120px;margin:0 auto;padding-inline:var(--gutter)}
.ic{display:inline-flex;flex:none;width:22px;height:22px}
.ic svg{width:100%;height:100%;fill:currentColor}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;color:#fff;padding-block:clamp(28px,5vw,48px) clamp(56px,7vw,76px);
  background:radial-gradient(1100px 320px at 85% -30%,rgba(1,193,188,.24),transparent 60%),linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 55%,var(--teal-deep) 140%)}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,var(--teal) 0%,var(--teal-2) 45%,var(--gold) 100%)}
.herotop{display:flex;align-items:center;gap:18px;margin-bottom:clamp(18px,3vw,28px)}
.logoplate{background:#fff;border-radius:14px;padding:9px 13px;line-height:0;box-shadow:0 8px 22px rgba(0,0,0,.18);flex:none}
.logoplate img{height:clamp(44px,6vw,58px);width:auto;display:block}
.herotop .div{width:1px;height:40px;background:rgba(255,255,255,.18)}
.eyebrow{font-size:.74rem;letter-spacing:.18em;text-transform:uppercase;font-weight:800;line-height:1.45;color:var(--teal)}
.hero h1{margin:0;font-family:var(--display);font-weight:600;font-size:clamp(1.7rem,3.6vw,2.6rem);line-height:1.12;letter-spacing:-.01em;text-wrap:balance;max-width:22ch}
.hero .sub{margin:14px 0 0;color:#CFD8E6;font-size:clamp(.98rem,1.4vw,1.08rem);max-width:62ch}

/* ---------- form card ---------- */
main{padding-bottom:60px}
.formcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-top:-44px;position:relative;z-index:2;overflow:hidden}
.leadline{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;padding:14px clamp(18px,3vw,32px);background:var(--tint-2);border-bottom:1px solid var(--line-2);font-size:.9rem;color:var(--muted)}
.leadline b{color:var(--teal-deep)}
.leadline .dot{width:4px;height:4px;border-radius:50%;background:var(--soft)}
.hero.compact{padding-block:clamp(22px,3vw,30px) clamp(54px,6vw,64px)}
.hero.compact .herotop{margin-bottom:14px}
.hero.compact h1{font-size:clamp(1.3rem,2.4vw,1.7rem);max-width:none}
.hero.compact .sub{display:none}
.hero.compact .logoplate img{height:clamp(38px,4.5vw,46px)}

/* stepper */
.stepper{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:20px clamp(12px,3vw,32px) 18px;border-bottom:1px solid var(--line-2);position:relative}
.stepper button{background:none;border:0;padding:0 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;position:relative;min-width:0}
.stepper button:disabled{cursor:default}
.stepper button::before{content:"";position:absolute;top:17px;left:calc(-50% + 22px);right:calc(50% + 22px);height:2px;background:var(--line)}
.stepper button:first-child::before{display:none}
.stepper button.past::before,.stepper button.now::before{background:var(--teal-2)}
.stepper .n{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.85rem;background:var(--line-2);color:var(--muted);border:2px solid transparent;transition:.2s}
.stepper .past .n{background:var(--tint);color:var(--teal-deep)}
.stepper .now .n{background:var(--teal-deep);color:#fff;box-shadow:0 0 0 5px rgba(1,193,188,.18)}
.stepper .lbl{font-size:.8rem;font-weight:700;color:var(--muted);text-align:center;line-height:1.3;overflow-wrap:anywhere}
.stepper .now .lbl{color:var(--ink)}
.stepper button:not(:disabled):hover .n{border-color:var(--teal)}

/* panels */
.panel{padding:clamp(22px,3.5vw,40px) clamp(18px,3.5vw,40px) 8px}
.phead{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
.phead .t{display:flex;gap:14px;align-items:flex-start;min-width:0;flex:1 1 420px}
.phead .badge{width:48px;height:48px;border-radius:14px;background:var(--tint);color:var(--teal-deep);display:grid;place-items:center;flex:none}
.phead .badge .ic{width:28px;height:28px}
.phead h2{margin:0;font-family:var(--display);font-weight:600;font-size:clamp(1.35rem,2.4vw,1.75rem);line-height:1.2;text-wrap:balance}
.phead p{margin:6px 0 0;color:var(--muted);max-width:70ch}
.helpbtn{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-weight:700;font-size:.85rem;color:var(--teal-deep);cursor:pointer;flex:none}
.helpbtn:hover{border-color:var(--teal)}
.helpbtn .q{width:20px;height:20px;border-radius:50%;background:var(--teal-deep);color:#fff;display:grid;place-items:center;font-size:.75rem}
.help{background:var(--tint-2);border:1px solid #D5ECEA;border-radius:var(--r-sm);padding:16px 18px;margin:0 0 20px;font-size:.92rem;color:var(--ink)}
.help h3{margin:0 0 6px;font-size:.95rem}
.help ul{margin:6px 0 0;padding-left:1.1em}
.help li{margin:3px 0}

/* welcome */
.objective{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:clamp(16px,3vw,28px);margin-bottom:26px}
.objbox{border-radius:var(--r-sm);background:linear-gradient(135deg,var(--tint-2),#fff);border:1px solid #D5ECEA;padding:clamp(18px,2.5vw,26px)}
.objbox .k{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--teal-deep);margin-bottom:6px}
.objbox p{margin:0 0 12px}
.objbox p:last-child{margin:0}
.objbox .lead{font-family:var(--display);font-size:clamp(1.1rem,1.8vw,1.3rem);line-height:1.35;color:var(--navy)}
.why{display:grid;gap:10px;align-content:start}
.why .k{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--muted)}
.why div.row{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-sm);font-size:.9rem}
.why .row .ic{color:var(--teal-deep);width:24px;height:24px;margin-top:1px}
.why .row b{display:block;font-size:.92rem}
.why .row span{color:var(--muted)}
.flow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:26px}
.flow>div{display:flex;gap:12px;align-items:center;padding:14px;border-radius:var(--r-sm);background:var(--bg)}
.flow .ic{width:30px;height:30px;color:var(--teal-deep)}
.flow b{display:block;font-size:.95rem}
.flow small{color:var(--muted);font-size:.8rem}
.namefield{max-width:520px}
label.fl{display:block;font-weight:700;margin-bottom:8px}
label.fl .req{color:var(--err);margin-left:3px}
.in{width:100%;padding:13px 15px;border:1.5px solid var(--line);border-radius:var(--r-sm);background:#fff;font-size:1rem;transition:.15s}
.in:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 4px rgba(1,193,188,.16)}
.in.bad{border-color:var(--err)}
textarea.in{resize:vertical;min-height:84px;line-height:1.5}
.fieldmsg{font-size:.82rem;color:var(--err);margin-top:6px;min-height:1.2em}
.note{font-size:.82rem;color:var(--muted);margin-top:6px}

/* option cards (vision / mission) */
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:14px}
.opt{position:relative;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:var(--r-sm);padding:18px 18px 16px 18px;cursor:pointer;display:flex;flex-direction:column;gap:12px;transition:border-color .15s,box-shadow .15s,transform .15s;min-width:0}
.opt:hover{border-color:var(--teal);transform:translateY(-1px)}
.opt[aria-checked=true]{border-color:var(--teal-deep);box-shadow:var(--shadow-sel);background:linear-gradient(180deg,#fff,var(--tint-2))}
.opt .top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.opt .letter{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--teal-deep)}
.opt .radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;transition:.15s}
.opt[aria-checked=true] .radio{border-color:var(--teal-deep);background:var(--teal-deep)}
.opt[aria-checked=true] .radio::after{content:"";width:8px;height:8px;border-radius:50%;background:#fff}
.opt .stmt{font-family:var(--display);font-size:clamp(1.02rem,1.5vw,1.14rem);line-height:1.45;color:var(--navy);overflow-wrap:break-word}
.opt .tag{align-self:flex-start;margin-top:auto;font-size:.76rem;font-weight:700;color:var(--muted);background:var(--bg);border-radius:999px;padding:4px 11px;line-height:1.35}
.opt[aria-checked=true] .tag{background:#fff;color:var(--teal-deep)}
.opt.own{border-style:dashed;justify-content:center}
.opt.own .stmt{font-family:var(--body);font-weight:700;font-size:1rem}
.opt.own .hint{color:var(--muted);font-size:.86rem}
.ownbox{margin-top:16px;max-width:760px}
.refine{margin-top:18px;max-width:760px}
.linkbtn{background:none;border:0;padding:0;color:var(--teal-deep);font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-size:.9rem}
.counter{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 13px;font-weight:800;font-size:.85rem;background:var(--tint);color:var(--teal-deep);font-variant-numeric:tabular-nums}
.counter.full{background:var(--teal-deep);color:#fff}

/* values */
.vals{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:12px}
.val{position:relative;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:var(--r-sm);padding:16px 16px 14px;cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:.15s;min-width:0}
.val:hover:not(:disabled){border-color:var(--teal)}
.val .name{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;font-weight:800;font-size:1rem;color:var(--navy)}
.val .box{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);flex:none;display:grid;place-items:center;transition:.15s}
.val .means{font-size:.9rem;color:var(--ink);line-height:1.45}
.val .insp{margin-top:auto;padding-top:8px;border-top:1px dashed var(--line);font-size:.74rem;color:var(--soft);line-height:1.4}
.val[aria-pressed=true]{border-color:var(--teal-deep);box-shadow:var(--shadow-sel);background:linear-gradient(180deg,#fff,var(--tint-2))}
.val[aria-pressed=true] .box{background:var(--teal-deep);border-color:var(--teal-deep)}
.val[aria-pressed=true] .box::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.val:disabled{opacity:.45;cursor:not-allowed}

/* review */
.review{display:grid;gap:14px}
.rv{border:1px solid var(--line);border-radius:var(--r-sm);padding:18px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:start}
.rv .ic{width:28px;height:28px;color:var(--teal-deep)}
.rv .k{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--teal-deep);margin-bottom:4px}
.rv .v{font-family:var(--display);font-size:1.05rem;color:var(--navy);overflow-wrap:break-word}
.rv .extra{margin-top:6px;font-size:.88rem;color:var(--muted);overflow-wrap:anywhere}
.rv ul{margin:4px 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px}
.rv li{background:var(--tint);color:var(--teal-deep);font-weight:700;font-size:.85rem;border-radius:999px;padding:4px 12px}

/* nav bar */
.navbar{display:flex;align-items:center;gap:14px;padding:18px clamp(18px,3.5vw,40px) 22px;margin-top:24px;border-top:1px solid var(--line-2);background:#fff}
.navbar .status{flex:1;min-width:0;font-size:.88rem;color:var(--muted);font-weight:600}
.navbar .status.warn{color:var(--err)}
.btn{border:0;border-radius:var(--r-sm);padding:13px 24px;font-weight:800;font-size:.98rem;cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;transition:.15s}
.btn.primary{color:#fff;background:linear-gradient(135deg,var(--teal-deep),var(--teal-2));box-shadow:0 8px 20px rgba(0,87,85,.25)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.primary[aria-disabled=true]{background:#A9BFC1;box-shadow:none;cursor:not-allowed}
.btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.btn.ghost:hover{border-color:var(--teal)}
:is(.btn,.opt,.val,.helpbtn,.linkbtn,.stepper button):focus-visible{outline:3px solid var(--teal);outline-offset:2px}

.err{background:var(--err-bg);color:var(--err);border-radius:var(--r-sm);padding:12px 14px;font-size:.9rem;margin-top:16px}
.setup{background:var(--gold-tint);color:var(--gold-ink);border-radius:var(--r-sm);padding:12px 14px;font-size:.88rem;font-weight:600;margin-top:18px}
.thanks{text-align:center;padding:clamp(40px,7vw,72px) clamp(20px,5vw,60px)}
.thanks .big{width:84px;height:84px;border-radius:50%;background:var(--tint);color:var(--teal-deep);display:grid;place-items:center;margin:0 auto 18px}
.thanks .big .ic{width:44px;height:44px}
.thanks h2{font-family:var(--display);font-weight:600;font-size:clamp(1.6rem,3vw,2.1rem);margin:0 0 10px}
.thanks p{color:var(--muted);max-width:56ch;margin:0 auto}
footer{text-align:center;color:var(--soft);font-size:.8rem;padding:0 var(--gutter) 36px}
footer::before{content:"";display:block;width:44px;height:3px;border-radius:3px;margin:0 auto 12px;background:linear-gradient(90deg,var(--teal),var(--gold))}

/* ---------- results ---------- */
.kpis{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:20px}
.kpi{background:var(--bg);border-radius:var(--r-sm);padding:12px 16px;min-width:140px}
.kpi b{display:block;font-size:1.6rem;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--navy)}
.kpi span{font-size:.8rem;color:var(--muted);font-weight:600}
.rgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.rcard{border:1px solid var(--line);border-radius:var(--r-sm);padding:20px;min-width:0}
.rcard.span2{grid-column:1/-1}
.rcard h3{display:flex;align-items:center;gap:10px;margin:0 0 14px;font-size:1rem}
.rcard h3 .ic{color:var(--teal-deep)}
.bar{display:grid;grid-template-columns:minmax(0,1fr) 52px;gap:4px 12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line-2)}
.bar:last-child{border-bottom:0}
.bar .lbl{font-size:.9rem;line-height:1.4;min-width:0;overflow-wrap:break-word}
.bar .lbl i{font-family:var(--display);font-style:normal;color:var(--navy)}
.bar .lbl .l{font-size:.7rem;font-weight:800;letter-spacing:.12em;color:var(--teal-deep);margin-right:6px}
.bar .num{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.bar .num small{display:block;font-size:.72rem;color:var(--muted);font-weight:600}
.bar .trk{grid-column:1/-1;height:10px;border-radius:5px;background:var(--line-2);overflow:hidden}
.bar .trk i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--teal-deep),var(--teal-2))}
.bar.lead .trk i{background:linear-gradient(90deg,var(--teal-deep),var(--teal))}
.leadtag{display:inline-block;margin-left:6px;font-size:.66rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:var(--gold-tint);color:var(--gold-ink);border-radius:999px;padding:2px 8px;vertical-align:1px}
.quotes{display:grid;gap:10px}
.quote{background:var(--tint-2);border-radius:var(--r-sm);padding:12px 14px}
.quote .k{font-size:.68rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--teal-deep)}
.quote p{margin:4px 0 2px;font-family:var(--display);overflow-wrap:anywhere}
.quote small{color:var(--muted)}
.people{display:flex;flex-wrap:wrap;gap:6px}
.people span{background:var(--bg);border-radius:999px;padding:4px 12px;font-size:.84rem;font-weight:600}
.qr{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
#qrcode{padding:10px;border:1px solid var(--line);border-radius:var(--r-sm);background:#fff;line-height:0}
.link{font-size:.85rem;color:var(--muted);overflow-wrap:anywhere}
.empty{color:var(--muted);font-size:.9rem}

/* ---------- responsive ---------- */
@media (max-width:860px){
  .objective{grid-template-columns:1fr}
  .rgrid{grid-template-columns:1fr}
}
@media (max-width:640px){
  .leadline .dot{display:none}
  .leadline{flex-direction:column;align-items:flex-start;gap:2px}
  body{font-size:15px}
  .herotop .div,.herotop .eyebrow{display:none}
  .flow{grid-template-columns:1fr}
  .stepper{padding-inline:6px}
  .stepper .lbl{display:none}
  .stepper .now .lbl{display:block;position:absolute;top:42px;white-space:nowrap}
  .stepper{padding-bottom:34px}
  .navbar{position:sticky;bottom:0;z-index:5;box-shadow:0 -8px 20px rgba(23,32,58,.06);padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
  .navbar .status{font-size:.8rem}
  .btn{padding:12px 18px}
  .rv{grid-template-columns:auto minmax(0,1fr)}
  .rv .linkbtn{grid-column:2}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="hero">

/* ---------------- content ---------------- */
const VISIONS = [
  {id:'A', text:'To be the world’s most trusted business partner, supporting every company from its first licence to its fullest ambition.', tag:'Partnership across the whole journey'},
  {id:'B', text:'To be the business home of choice for companies worldwide, where every business is supported by people invested in its success.', tag:'Belonging, backed by our people'},
  {id:'C', text:'To be the most trusted home for business globally, supporting every company, whatever its size, from its first day to its greatest success.', tag:'Trust, inclusiveness and the full journey'},
  {id:'D', text:'To set the global benchmark for business experience, making RAKEZ the first choice for companies to establish, grow and remain.', tag:'Experience as our differentiator'},
  {id:'E', text:'To be the global gateway where businesses of every size establish, grow and prosper, supported by a partnership they can rely on.', tag:'Global reach, built around our clients'},
];
const MISSIONS = [
  {id:'A', text:'We support businesses of every size, from set-up to expansion, with seamless services, expert guidance and a team that takes ownership of every outcome.', tag:'Partnership and ownership'},
  {id:'B', text:'We empower our people to deliver consistent, caring and responsive service, so every client and partner can establish, operate and grow with confidence.', tag:'Our people make the experience'},
  {id:'C', text:'We combine fit-for-purpose facilities, integrated business services and genuine care to help our clients grow and attract lasting investment to Ras Al Khaimah.', tag:'Facilities and services, client first'},
  {id:'D', text:'We make doing business in Ras Al Khaimah simple and dependable by listening to our clients, acting with integrity and continuously improving how we serve them.', tag:'Ease, integrity and improvement'},
  {id:'E', text:'We build long-term partnerships with our clients and channel partners, delivering integrated solutions and dependable service that help them grow and strengthen the Ras Al Khaimah economy.', tag:'Growing together, partners included'},
];
const VALUES = [
  {id:'customer', name:'Customer at the Heart', means:'We start with the customer’s need and work back from it.', insp:'Amazon · Singapore Airlines'},
  {id:'ownership', name:'Ownership', means:'We own every issue until it is resolved, whichever department it sits in.', insp:'Ritz-Carlton · Amazon · IKEA'},
  {id:'care', name:'Genuine Care', means:'We treat every client with the same care, whatever their size.', insp:'Ritz-Carlton · Singapore Airlines'},
  {id:'integrity', name:'Integrity', means:'We are honest about what we can and cannot do, and we keep our commitments.', insp:'Singapore Airlines · Amazon · Zappos'},
  {id:'empowered', name:'Empowered to Act', means:'We trust our people to use good judgement, and we back them when they do.', insp:'Nordstrom · Ritz-Carlton'},
  {id:'simplicity', name:'Simplicity', means:'We remove complexity so that doing business with us is effortless.', insp:'IKEA · Amazon'},
  {id:'onerakez', name:'One RAKEZ', means:'We work as one team, sharing information and responsibility across departments.', insp:'IKEA · Singapore Airlines'},
  {id:'improve', name:'Continuous Improvement', means:'We learn from every issue, fix the root cause and raise the standard.', insp:'IKEA · Zappos'},
  {id:'excellence', name:'Excellence in Every Detail', means:'We deliver consistent quality at every touchpoint, across the whole journey.', insp:'Singapore Airlines · Disney'},
  {id:'respect', name:'Respect & Inclusion', means:'We treat customers and colleagues with respect and make everyone feel welcome.', insp:'Disney · Ritz-Carlton'},
  {id:'lead', name:'Lead by Example', means:'Our leaders model these values first and give their people room to grow.', insp:'IKEA'},
];
const PICK = 5;
const STEPS = [
  {key:'welcome', label:'Welcome', icon:'users'},
  {key:'vision',  label:'Vision',  icon:'vision'},
  {key:'mission', label:'Mission', icon:'mission'},
  {key:'values',  label:'Values',  icon:'values'},
  {key:'review',  label:'Review',  icon:'check'},
];

/* ---------------- state ---------------- */
const blank = () => ({step:0, maxStep:0, name:'', vision:'', visionOwn:'', visionNote:'', mission:'', missionOwn:'', missionNote:'', values:[], valueOwn:'', help:{}, showNote:{}, touched:false, sending:false, error:'', sent:false});
let S = blank();
try { const d = JSON.parse(localStorage.getItem('rakez_vmv_draft') || 'null'); if (d && !d.sent) S = Object.assign(blank(), d, {sending:false, error:'', touched:false}); } catch(e) {}
const save = () => { try { localStorage.setItem('rakez_vmv_draft', JSON.stringify(S)); } catch(e) {} };

function stepCheck(k){
  if (k==='welcome') return S.name.trim().length >= 2 ? '' : 'Please enter your name to begin.';
  if (k==='vision')  return !S.vision ? 'Choose one vision to continue.' : (S.vision==='own' && S.visionOwn.trim().length<10 ? 'Write your vision statement, or pick one of the options.' : '');
  if (k==='mission') return !S.mission ? 'Choose one mission to continue.' : (S.mission==='own' && S.missionOwn.trim().length<10 ? 'Write your mission statement, or pick one of the options.' : '');
  if (k==='values')  return S.values.length === PICK ? '' : `Choose ${PICK - S.values.length} more value${PICK - S.values.length === 1 ? '' : 's'} (${S.values.length} of ${PICK} selected).`;
  return '';
}
function stepHint(k){
  if (k==='welcome') return 'About 3 minutes · your answers are saved on this device as you go';
  if (k==='vision')  return S.vision ? (S.vision==='own' ? 'Your own vision' : 'Option '+S.vision+' selected') : 'Pick the one that inspires you most';
  if (k==='mission') return S.mission ? (S.mission==='own' ? 'Your own mission' : 'Option '+S.mission+' selected') : 'Pick the one that describes us best';
  if (k==='values')  return `${S.values.length} of ${PICK} selected`;
  if (k==='review')  return 'Check your choices, then submit';
  return '';
}

/* ---------------- views ---------------- */
function helpBlock(key, title, items){
  const open = !!S.help[key];
  return {
    btn: `<button type="button" class="helpbtn" data-act="help" data-k="${key}" aria-expanded="${open}" aria-controls="help-${key}"><span class="q">?</span>${open?'Hide guidance':'What makes a good '+key+'?'}</button>`,
    box: open ? `<div class="help" id="help-${key}"><h3>${esc(title)}</h3><ul>${items.map(i=>`<li>${i}</li>`).join('')}</ul></div>` : ''
  };
}

function vWelcome(){
  return `
  <section class="panel" aria-labelledby="h-welcome">
    <div class="objective">
      <div class="objbox">
        <div class="k">Objective</div>
        <p class="lead">To agree one vision, one mission and a shared set of values for RAKEZ, the same for every customer segment, that customers can feel and every colleague can act on.</p>
        <p>At the CX Vision Workshop on 21 September, leadership agreed that our current statements need refreshing and that RAKEZ needs defined values. Your choices here will shape the options we take into the next workshop.</p>
      </div>
      <div class="why">
        <div class="k">Why now</div>
        <div class="row">${ic('vision')}<div><b>Our vision is generic</b><span>“A leading global investment destination” doesn’t say what makes RAKEZ different.</span></div></div>
        <div class="row">${ic('mission')}<div><b>Our mission leads with infrastructure</b><span>It describes what we build, not how we serve.</span></div></div>
        <div class="row">${ic('values')}<div><b>We have no defined values</b><span>Nothing yet guides how we behave with customers and each other.</span></div></div>
      </div>
    </div>
    <div class="namefield">
      <label class="fl" for="name">Your full name<span class="req" aria-hidden="true">*</span></label>
      <input class="in ${S.touched && stepCheck('welcome') ? 'bad':''}" id="name" data-act="name" type="text" maxlength="80" autocomplete="name" placeholder="e.g. Aysha Saeed" value="${esc(S.name)}" aria-required="true">
      <div class="note">All options were drafted from the workshop discussion and from organisations known for their culture and service. None of them copies another organisation’s wording.</div>
    </div>
    ${backendReady() ? '' : '<div class="setup">Setup needed: this page isn’t connected to the response sheet yet (APPS_SCRIPT_URL). You can explore it, but answers can’t be submitted.</div>'}
  </section>`;
}

function vChoose(kind){
  const isV = kind === 'vision';
  const list = isV ? VISIONS : MISSIONS;
  const sel = S[kind];
  const own = S[kind+'Own'], note = S[kind+'Note'];
  const h = isV
    ? helpBlock('vision', 'A strong vision is where we are going', ['<b>Aspirational</b>: it describes the future we are working towards, not what we do today.','<b>Long-term</b>: it should still hold true in 10 years.','<b>Short and memorable</b>: one sentence anyone at RAKEZ can repeat.','<b>Global</b>: RAKEZ serves businesses from around the world.'])
    : helpBlock('mission', 'A strong mission is what we do, for whom and how', ['<b>What</b>: the value we deliver every day.','<b>For whom</b>: our clients and partners, of every size and segment.','<b>How</b>: the way we deliver it, which is where our culture shows.','<b>Practical</b>: a colleague should be able to use it to make a decision.']);
  return `
  <section class="panel" aria-labelledby="h-${kind}">
    <div class="phead">
      <div class="t"><div class="badge">${ic(isV?'vision':'mission')}</div><div>
        <h2 id="h-${kind}">${isV ? 'Which vision should guide RAKEZ?' : 'Which mission best describes what we do?'}</h2>
        <p>${isV ? 'The vision is our long-term ambition: where RAKEZ is going. Choose the one that inspires you most.' : 'The mission is how we get there every day. Choose the one that best describes how RAKEZ should serve its clients and partners.'}</p>
      </div></div>
      ${h.btn}
    </div>
    ${h.box}
    <div class="opts" role="radiogroup" aria-labelledby="h-${kind}">
      ${list.map(o => `
        <button type="button" class="opt" role="radio" aria-checked="${sel===o.id}" data-act="pick" data-kind="${kind}" data-v="${o.id}">
          <span class="top"><span class="letter">Option ${o.id}</span><span class="radio"></span></span>
          <span class="stmt">${esc(o.text)}</span>
          <span class="tag">${esc(o.tag)}</span>
        </button>`).join('')}
      <button type="button" class="opt own" role="radio" aria-checked="${sel==='own'}" data-act="pick" data-kind="${kind}" data-v="own">
        <span class="top"><span class="letter">Your own</span><span class="radio"></span></span>
        <span class="stmt">None of these quite fits</span>
        <span class="hint">Write your own ${kind} statement instead.</span>
      </button>
    </div>
    ${sel==='own' ? `
      <div class="ownbox">
        <label class="fl" for="${kind}Own">Your ${kind} statement<span class="req" aria-hidden="true">*</span></label>
        <textarea class="in" id="${kind}Own" data-act="text" data-f="${kind}Own" maxlength="300" placeholder="${isV ? 'To be…' : 'We…'}">${esc(own)}</textarea>
        <div class="note">One sentence is ideal. Up to 300 characters.</div>
      </div>` : ''}
    ${sel && sel!=='own' ? `
      <div class="refine">
        ${S.showNote[kind] || note ? `
          <label class="fl" for="${kind}Note">How would you refine Option ${sel}? <span class="note" style="font-weight:500">(optional)</span></label>
          <textarea class="in" id="${kind}Note" data-act="text" data-f="${kind}Note" maxlength="300" placeholder="e.g. replace “trusted” with “preferred”">${esc(note)}</textarea>`
        : `<button type="button" class="linkbtn" data-act="shownote" data-kind="${kind}">Suggest a word change to Option ${sel} (optional)</button>`}
      </div>` : ''}
  </section>`;
}

function vValues(){
  const n = S.values.length, full = n >= PICK;
  const h = helpBlock('value', 'Values describe how we behave', ['Each value is paired with a behaviour, so it can be seen and measured in everyday work.','Choose the five you most want customers and colleagues to recognise as “the RAKEZ way”.','“Inspired by” shows organisations known for this behaviour. The wording is our own.','Values will be used in hiring, recognition, KPIs and appraisal, so choose ones we can truly live.']);
  return `
  <section class="panel" aria-labelledby="h-values">
    <div class="phead">
      <div class="t"><div class="badge">${ic('values')}</div><div>
        <h2 id="h-values">Which 5 should define how we work?</h2>
        <p>Values are the behaviours that should stay the same across every segment and every interaction. Pick the five that matter most. <span class="counter ${full?'full':''}" aria-live="polite">${n} / ${PICK}</span></p>
      </div></div>
      ${h.btn}
    </div>
    ${h.box}
    <div class="vals">
      ${VALUES.map(v => { const on = S.values.includes(v.id); return `
        <button type="button" class="val" data-act="val" data-v="${v.id}" aria-pressed="${on}" ${full && !on ? 'disabled' : ''}>
          <span class="name">${esc(v.name)}<span class="box"></span></span>
          <span class="means">${esc(v.means)}</span>
          <span class="insp">Inspired by ${esc(v.insp)}</span>
        </button>`; }).join('')}
    </div>
    <div class="refine">
      <label class="fl" for="valueOwn">Is an important value missing? <span class="note" style="font-weight:500">(optional)</span></label>
      <input class="in" id="valueOwn" data-act="text" data-f="valueOwn" type="text" maxlength="160" placeholder="Name the value and, if you like, what it looks like in practice" value="${esc(S.valueOwn)}">
    </div>
  </section>`;
}

function vReview(){
  const v = VISIONS.find(x=>x.id===S.vision), m = MISSIONS.find(x=>x.id===S.mission);
  const vtxt = S.vision==='own' ? S.visionOwn : (v ? v.text : '');
  const mtxt = S.mission==='own' ? S.missionOwn : (m ? m.text : '');
  const vals = S.values.map(id => (VALUES.find(x=>x.id===id)||{}).name).filter(Boolean);
  return `
  <section class="panel" aria-labelledby="h-review">
    <div class="phead"><div class="t"><div class="badge">${ic('check')}</div><div>
      <h2 id="h-review">Review your choices, ${esc(S.name.trim().split(/\s+/)[0] || '')}</h2>
      <p>Check everything reads the way you want. You can change any answer before you submit.</p>
    </div></div></div>
    <div class="review">
      <div class="rv">${ic('vision')}<div><div class="k">Vision · ${S.vision==='own'?'Your own':'Option '+esc(S.vision)}</div><div class="v">${esc(vtxt)}</div>${S.vision!=='own'&&S.visionNote?`<div class="extra">Suggested refinement: ${esc(S.visionNote)}</div>`:''}</div><button type="button" class="linkbtn" data-act="goto" data-s="1">Change</button></div>
      <div class="rv">${ic('mission')}<div><div class="k">Mission · ${S.mission==='own'?'Your own':'Option '+esc(S.mission)}</div><div class="v">${esc(mtxt)}</div>${S.mission!=='own'&&S.missionNote?`<div class="extra">Suggested refinement: ${esc(S.missionNote)}</div>`:''}</div><button type="button" class="linkbtn" data-act="goto" data-s="2">Change</button></div>
      <div class="rv">${ic('values')}<div><div class="k">Your 5 values</div><ul>${vals.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>${S.valueOwn?`<div class="extra">Missing value suggested: ${esc(S.valueOwn)}</div>`:''}</div><button type="button" class="linkbtn" data-act="goto" data-s="3">Change</button></div>
    </div>
    ${S.error ? `<div class="err" role="alert">${esc(S.error)}</div>` : ''}
  </section>`;
}

function vThanks(){
  return `
  <section class="thanks">
    <div class="big">${ic('check')}</div>
    <h2>Thank you${S.name ? ', ' + esc(S.name.trim().split(/\s+/)[0]) : ''}</h2>
    <p>Your choices have been recorded. We’ll bring the combined results to the next workshop, where we’ll agree the final vision, mission and values together.</p>
  </section>`;
}

function stepper(){
  return `<nav class="stepper" aria-label="Survey progress">${STEPS.map((s,i)=>{
    const cls = i < S.step ? 'past' : (i === S.step ? 'now' : '');
    const can = i <= S.maxStep && i !== S.step;
    return `<button type="button" class="${cls}" data-act="goto" data-s="${i}" ${can?'':'disabled'} ${i===S.step?'aria-current="step"':''} aria-label="Step ${i+1}: ${s.label}"><span class="n">${i < S.step ? '✓' : i+1}</span><span class="lbl">${s.label}</span></button>`;
  }).join('')}</nav>`;
}

function render(){
  const app = document.getElementById('app');
  document.querySelector('.hero').classList.toggle('compact', S.step > 0 && !S.sent);
  if (S.sent){ app.innerHTML = vThanks(); return; }
  const k = STEPS[S.step].key;
  const body = {welcome:vWelcome, vision:()=>vChoose('vision'), mission:()=>vChoose('mission'), values:vValues, review:vReview}[k]();
  const problem = stepCheck(k);
  const last = S.step === STEPS.length - 1;
  app.innerHTML = `
    ${S.step === 0 ? '<div class="leadline"><span>Takes about <b>3 minutes</b></span><span class="dot"></span><span>No long answers needed</span><span class="dot"></span><span>Only your name is recorded</span></div>' : ''}
    ${stepper()}
    ${body}
    <div class="navbar">
      ${S.step > 0 ? '<button type="button" class="btn ghost" data-act="back">Back</button>' : ''}
      <div class="status ${S.touched && problem ? 'warn' : ''}" id="status" aria-live="polite">${esc(S.touched && problem ? problem : stepHint(k))}</div>
      <button type="button" class="btn primary" data-act="next" aria-disabled="${!!problem || S.sending}">${S.sending ? 'Submitting…' : last ? 'Submit' : (S.step === 0 ? 'Start' : 'Next')}${!S.sending ? ' <span aria-hidden="true">→</span>' : ''}</button>
    </div>`;
}
function refreshNav(){
  const k = STEPS[S.step].key, problem = stepCheck(k);
  const st = document.getElementById('status'); if (st){ st.textContent = S.touched && problem ? problem : stepHint(k); st.classList.toggle('warn', !!(S.touched && problem)); }
  const nx = document.querySelector('[data-act=next]'); if (nx) nx.setAttribute('aria-disabled', String(!!problem || S.sending));
  const nm = document.getElementById('name'); if (nm) nm.classList.toggle('bad', !!(S.touched && stepCheck('welcome')));
}
function go(i){
  S.step = i; S.maxStep = Math.max(S.maxStep, i); S.touched = false; S.error = '';
  save(); render();
  document.getElementById('app').scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block:'start'});
}
function rerenderKeep(){ const y = window.scrollY; render(); window.scrollTo(0, y); }

async function submit(){
  if (!backendReady()){ S.error = 'This page isn’t connected to the response sheet yet, so your answers can’t be submitted. Please let the workshop organiser know.'; rerenderKeep(); return; }
  S.sending = true; S.error = ''; rerenderKeep();
  const answers = {vision:S.vision, visionOwn:S.vision==='own'?S.visionOwn.trim():'', visionNote:S.vision!=='own'?S.visionNote.trim():'', mission:S.mission, missionOwn:S.mission==='own'?S.missionOwn.trim():'', missionNote:S.mission!=='own'?S.missionNote.trim():'', values:S.values, valueOwn:S.valueOwn.trim()};
  const url = `${APPS_SCRIPT_URL}?action=submit&round=vmv&name=${encodeURIComponent(S.name.trim())}&answers=${encodeURIComponent(JSON.stringify(answers))}`;
  try{
    const res = await fetch(url); const data = await res.json();
    if (!data || data.ok !== true) throw new Error(data && data.error ? data.error : 'unexpected response');
    S.sent = true; S.sending = false; save(); render(); window.scrollTo({top:0});
  }catch(e){
    S.sending = false; S.error = 'Your answers couldn’t be sent (' + e.message + '). Check your connection and press Submit again. Your choices are still here.'; rerenderKeep();
  }
}

/* ---------------- events ---------------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act;
  if (MODE === 'results'){ if (a==='reload') loadResults(); if (a==='copy') copyLink(); return; }
  if (a === 'next'){
    const problem = stepCheck(STEPS[S.step].key);
    if (problem){ S.touched = true; refreshNav(); const f = document.querySelector('.in.bad, textarea.in'); if (S.step===0) document.getElementById('name').focus(); return; }
    if (S.step === STEPS.length - 1){ submit(); return; }
    go(S.step + 1); return;
  }
  if (a === 'back'){ go(Math.max(0, S.step - 1)); return; }
  if (a === 'goto'){ go(+b.dataset.s); return; }
  if (a === 'help'){ S.help[b.dataset.k] = !S.help[b.dataset.k]; rerenderKeep(); return; }
  if (a === 'pick'){ S[b.dataset.kind] = b.dataset.v; S.touched = false; save(); rerenderKeep(); if (b.dataset.v==='own'){ const t=document.getElementById(b.dataset.kind+'Own'); if(t) t.focus({preventScroll:true}); } return; }
  if (a === 'shownote'){ S.showNote[b.dataset.kind] = true; rerenderKeep(); const t=document.getElementById(b.dataset.kind+'Note'); if(t) t.focus({preventScroll:true}); return; }
  if (a === 'val'){ const v = b.dataset.v; S.values = S.values.includes(v) ? S.values.filter(x=>x!==v) : (S.values.length < PICK ? [...S.values, v] : S.values); S.touched = false; save(); rerenderKeep(); return; }
});
document.addEventListener('input', e => {
  const t = e.target; if (!t.dataset) return;
  if (t.dataset.act === 'name'){ S.name = t.value; }
  else if (t.dataset.act === 'text'){ S[t.dataset.f] = t.value; }
  else return;
  save(); refreshNav();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'name'){ e.preventDefault(); document.querySelector('[data-act=next]').click(); }
});

/* ---------------- facilitator results (?view=results) ---------------- */
let RECORDS = [], SAMPLE = false;
function sampleRecords(){
  // Illustrative only. Shown, clearly labelled, until the sheet is connected.
  const vs = ['C','D','C','A','D','C','B','D','C','E','A','D'], ms = ['A','B','A','D','B','A','E','B','A','D','B','A'];
  const vv = [['ownership','care','empowered','onerakez','customer'],['ownership','integrity','simplicity','customer','improve'],['care','ownership','onerakez','empowered','excellence'],['customer','ownership','integrity','respect','lead']];
  return vs.map((v,i)=>({submittedAt: Date.now()-i*9e5, name:'Sample participant '+(i+1), answers:{vision:v, mission:ms[i], values:vv[i%4], visionNote: i===2?'Consider “preferred” instead of “trusted”':'', valueOwn: i===5?'Agility: we respond quickly to change':''}}));
}
async function loadResults(){
  const st = document.getElementById('upd'); if (st) st.textContent = 'Refreshing…';
  if (!backendReady()){ SAMPLE = true; RECORDS = sampleRecords(); renderResults(); return; }
  try{
    const res = await fetch(`${APPS_SCRIPT_URL}?action=list&round=vmv`); const data = await res.json();
    if (!Array.isArray(data)) throw new Error(data && data.error ? data.error : 'unexpected response');
    SAMPLE = false; RECORDS = data; renderResults();
  }catch(e){ renderResults('Couldn’t reach the response sheet (' + e.message + '). Showing the last results loaded.'); }
}
const tally = arr => arr.reduce((m,x)=>{ if (x) m[x]=(m[x]||0)+1; return m; }, {});
function bars(list, counts, N, labelFn){
  const rows = list.map(o => [o, counts[o.id]||0]).sort((a,b)=>b[1]-a[1]);
  const max = Math.max(1, ...rows.map(r=>r[1]));
  return rows.map(([o,n],i)=>`
    <div class="bar ${i===0&&n>0?'lead':''}"><div class="lbl">${labelFn(o)}${i===0&&n>0?'<span class="leadtag">Leading</span>':''}</div>
    <div class="num">${n}<small>${N?Math.round(n/N*100):0}%</small></div>
    <div class="trk"><i style="width:${(n/max*100).toFixed(1)}%"></i></div></div>`).join('');
}
function renderResults(warn){
  const recs = RECORDS.map(r => Object.assign({name:r.name, at:r.submittedAt}, r.answers || {}));
  const N = recs.length, link = location.href.split('?')[0].split('#')[0];
  const vC = tally(recs.map(r=>r.vision)), mC = tally(recs.map(r=>r.mission)), valC = tally(recs.flatMap(r=>r.values||[]));
  const vList = [...VISIONS, {id:'own', text:'Wrote their own'}], mList = [...MISSIONS, {id:'own', text:'Wrote their own'}];
  const notes = [];
  recs.forEach(r=>{
    if (r.visionOwn) notes.push(['Own vision', r.visionOwn, r.name]);
    if (r.visionNote) notes.push(['Vision '+r.vision+' refinement', r.visionNote, r.name]);
    if (r.missionOwn) notes.push(['Own mission', r.missionOwn, r.name]);
    if (r.missionNote) notes.push(['Mission '+r.mission+' refinement', r.missionNote, r.name]);
    if (r.valueOwn) notes.push(['Missing value', r.valueOwn, r.name]);
  });
  document.querySelector('.hero').classList.add('compact');
  document.getElementById('heroTitle').textContent = 'What the room is choosing';
  document.getElementById('heroSub').textContent = 'Live results from the pre-workshop survey. Refreshes every 30 seconds.';
  document.getElementById('app').innerHTML = `
  <section class="panel">
    <div class="phead">
      <div class="t"><div class="badge">${ic('users')}</div><div><h2>Facilitator view</h2><p id="upd">Updated ${new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</p></div></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap"><button type="button" class="btn ghost" data-act="copy">Copy survey link</button><button type="button" class="btn primary" data-act="reload">Refresh</button></div>
    </div>
    ${SAMPLE ? '<div class="setup" style="margin:0 0 18px">Sample data: the response sheet isn’t connected yet, so these results are illustrative only.</div>' : ''}
    ${warn ? `<div class="err" style="margin:0 0 18px">${esc(warn)}</div>` : ''}
    <div class="kpis"><div class="kpi"><b>${N}</b><span>responses</span></div><div class="kpi"><b>${notes.length}</b><span>written suggestions</span></div></div>
    <div class="rgrid">
      <div class="rcard">${''}<h3>${ic('vision')}Vision</h3>${bars(vList, vC, N, o=>`<span class="l">${o.id==='own'?'OWN':o.id}</span><i>${esc(o.text)}</i>`)}</div>
      <div class="rcard"><h3>${ic('mission')}Mission</h3>${bars(mList, mC, N, o=>`<span class="l">${o.id==='own'?'OWN':o.id}</span><i>${esc(o.text)}</i>`)}</div>
      <div class="rcard"><h3>${ic('values')}Values (each person picked 5)</h3>${bars(VALUES, valC, N, o=>`<b>${esc(o.name)}</b>`)}</div>
      <div class="rcard"><h3>${ic('words')}Suggestions in their words</h3><div class="quotes">${notes.length ? notes.map(n=>`<div class="quote"><div class="k">${esc(n[0])}</div><p>${esc(n[1])}</p><small>${esc(n[2]||'')}</small></div>`).join('') : '<p class="empty">No written suggestions yet.</p>'}</div></div>
      <div class="rcard"><h3>${ic('users')}Who has responded</h3><div class="people">${N ? recs.map(r=>`<span>${esc(r.name||'Unnamed')}</span>`).join('') : '<p class="empty">No responses yet.</p>'}</div></div>
      <div class="rcard"><h3>${ic('check')}Share the survey</h3><div class="qr"><div id="qrcode"></div><div style="min-width:0;flex:1"><b>Scan to take part</b><p class="link" id="plink">${esc(link)}</p></div></div></div>
    </div>
  </section>`;
  try { if (window.QRCode) new QRCode(document.getElementById('qrcode'), {text:link, width:128, height:128, colorDark:'#17203A', colorLight:'#FFFFFF'}); } catch(e) {}
}
async function copyLink(){
  const link = location.href.split('?')[0].split('#')[0], u = document.getElementById('upd');
  try { await navigator.clipboard.writeText(link); if (u) u.textContent = 'Survey link copied'; }
  catch(e){ const p = document.getElementById('plink'); if (p){ const r = document.createRange(); r.selectNodeContents(p); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } if (u) u.textContent = 'Press Ctrl+C to copy the selected link'; }
}

/* ---------------- boot ---------------- */
const MODE = (new URLSearchParams(location.search).get('view') === 'results' || location.hash === '#results') ? 'results' : 'survey';
if (MODE === 'results'){ loadResults(); setInterval(loadResults, 30000); } else render();
</script>
</body>
</html>
